<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Customer - Restaurant Manager{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link href="/static/css/customer.css" rel="stylesheet">
  <style>
    :root {
      --primary-brown: #8B4513;
      --primary-orange: #D2691E;
      --gold: #FFD700;
      --cream: #FFF8DC;
    }
    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #8B4513 0%, #D2691E 50%, #CD853F 100%);
      min-height: 100vh;
    }
    .customer-nav {
      background: linear-gradient(90deg, var(--primary-brown), var(--primary-orange));
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--gold);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .customer-nav .brand {
      color: var(--gold);
      font-size: 1.8em;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      text-decoration: none;
    }
    .customer-nav .nav-links {
      display: flex;
      gap: 20px;
    }
    .customer-nav .nav-links a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 20px;
      border-radius: 8px;
      transition: all 0.3s;
      font-size: 1.1em;
    }
    .customer-nav .nav-links a:hover,
    .customer-nav .nav-links a.active {
      background: var(--gold);
      color: var(--primary-brown);
    }
    .customer-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    .btn-custom {
      background: linear-gradient(145deg, #FFD700, #FFA500);
      color: #8B4513;
      font-weight: bold;
      border: none;
      padding: 10px 25px;
      border-radius: 10px;
      transition: all 0.3s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .btn-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255,215,0,0.5);
      color: #8B4513;
    }
    .card-custom {
      background: #fff;
      border-radius: 15px;
      border: 3px solid #D2691E;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: all 0.3s;
    }
    .card-custom:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .footer-bar {
      text-align: center;
      padding: 20px;
      color: rgba(255,255,255,0.8);
      font-style: italic;
    }
  </style>
</head>
<body>
  <nav class="customer-nav">
    <a href="{% url 'customer:menu' %}" class="brand">🍽️ Restaurant Manager</a>
    <div class="nav-links">
      <a href="{% url 'customer:menu' %}" class="{% if request.resolver_match.url_name == 'menu' %}active{% endif %}">
        <i class="bi bi-menu-app"></i> Menu
      </a>
      <a href="{% url 'customer:order' %}" class="{% if request.resolver_match.url_name == 'order' %}active{% endif %}">
        <i class="bi bi-receipt"></i> New Order
      </a>
    </div>
  </nav>

  <div class="customer-container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>

  <div class="footer-bar">
    Restaurant Manager &mdash; Qualité & Saveur
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
