{% extends 'base.html' %}
{% block title %}New Product{% endblock %}
{% block content %}
<div class="page-header">
  <h2>New Product</h2>
</div>

<div class="row">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">
        <i class="bi bi-box"></i> Product Details
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Product Name</label>
              <input type="text" name="nom" class="form-control" placeholder="E.g.: Grilled chicken" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Cooking Time</label>
              <input type="text" name="duree_cuisson" class="form-control" placeholder="E.g.: 30 min" required>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Servings</label>
              <input type="number" name="nombre_personnes" class="form-control" placeholder="E.g.: 4" min="1" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Description</label>
              <input type="text" name="description" class="form-control" placeholder="Brief description" required>
            </div>
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg"></i> Create Product
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card">
      <div class="card-header">
        <i class="bi bi-info-circle"></i> Note
      </div>
      <div class="card-body">
        <p class="text-muted mb-0">After creation, you can add the necessary ingredients for the product composition.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
